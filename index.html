<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>· 欢迎来到· 我的秘密空间 ·</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Playfair+Display:wght@700&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --accent: #ff00aa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            height: 100vh;
            position: relative;
        }
        
        /* 粒子背景 */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        
        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 0, 170, 0.2);
        }
        
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--accent);
        }
        
        .menu {
            display: flex;
            gap: 40px;
            font-weight: 700;
        }
        
        .menu a {
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
        }
        
        .menu a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: var(--accent);
            transition: width 0.3s;
        }
        
        .menu a:hover::after {
            width: 100%;
        }
        
        .menu a:hover {
            color: var(--accent);
        }
        
        /* 主内容 */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        .hero-content {
            max-width: 900px;
            padding: 0 20px;
        }
        
        .hero h1 {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 0, 170, 0.5);
        }
        
        .hero p {
            font-size: 1.4rem;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.85;
        }
        
        .cta {
            background: var(--accent);
            color: #000;
            padding: 16px 48px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.4s;
            box-shadow: 0 0 30px rgba(255, 0, 170, 0.6);
            display: inline-block;
        }
        
        .cta:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(255, 0, 170, 0.9);
        }
        
        /* 其他页面内容 */
        .content {
            min-height: 100vh;
            padding: 120px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .content h2 {
            font-size: 2.8rem;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 15px;
            display: inline-block;
        }
        
        /* 装饰星星 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
        }
        
        /* 随机点击特效 */
        .click-effect {
            position: fixed;
            color: #fff;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 200;
            transition: all 0.6s;
            opacity: 0;
            text-shadow: 0 0 15px var(--accent);
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <canvas id="particles"></canvas>
    
    <!-- 导航 -->
    <nav>
        <div class="nav-content">
            <div class="logo">· 秘密空间 ·</div>
            <div class="menu">
                <a href="#" onclick="showSection('home')">首页</a>
                <a href="#" onclick="showSection('about')">关于我</a>
                <a href="#" onclick="showSection('gallery')">图库</a>
                <a href="#" onclick="showSection('blog')">随笔</a>
            </div>
            <button onclick="toggleTheme()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;">🌙/☀️</button>
        </div>
    </nav>
    
    <!-- 首页 -->
    <div id="home" class="section">
        <div class="hero">
            <div class="hero-content">
                <h1>欢迎来到我的<br>秘密空间</h1>
                <p>这里只有你能看到的秘密……<br>现在开始探索吧</p>
                <a href="#" onclick="showSection('about')" class="cta">开始探索 &gt;</a>
            </div>
        </div>
    </div>
    
    <!-- 关于我页面 -->
    <div id="about" class="section" style="display:none;">
        <div class="content">
            <h2>关于我</h2>
            <p style="font-size:1.3rem; line-height:1.8; max-width:800px; margin:0 auto;">
                我叫小薇，一个喜欢在午夜写字的女孩。<br>
                这里是我的私人世界，充满咖啡色调、梦境般的氛围，和我偷偷藏起来的美好记忆。<br><br>
                点击导航栏切换页面，慢慢探索……<br>
                <span style="color:var(--accent);">心跳声渐弱，世界开始安静。</span>
            </p>
        </div>
    </div>
    
    <!-- 图库页面 -->
    <div id="gallery" class="section" style="display:none;">
        <div class="content">
            <h2>我的图库</h2>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px;">
                <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; text-align:center;">
                    <img src="https://picsum.photos/id/1015/600/400" style="width:100%; border-radius:8px; margin-bottom:10px;">
                    <p style="font-size:0.9rem; opacity:0.7;">午夜咖啡馆</p>
                </div>
                <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; text-align:center;">
                    <img src="https://picsum.photos/id/201/600/400" style="width:100%; border-radius:8px; margin-bottom:10px;">
                    <p style="font-size:0.9rem; opacity:0.7;">星空下的你</p>
                </div>
                <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; text-align:center;">
                    <img src="https://picsum.photos/id/29/600/400" style="width:100%; border-radius:8px; margin-bottom:10px;">
                    <p style="font-size:0.9rem; opacity:0.7;">旧书与书签</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 随笔页面 -->
    <div id="blog" class="section" style="display:none;">
        <div class="content">
            <h2>我的随笔</h2>
            <div style="background:rgba(255,255,255,0.05); padding:40px; border-radius:15px; max-width:700px; margin:0 auto;">
                <p style="line-height:2; font-size:1.1rem;">
                    今天又是一个特别的夜晚。<br><br>
                    窗外下着细雨，我把灯调暗，只留一盏小台灯。<br><br>
                    想起上次和你一起走过的路……<br><br>
                    那些秘密，就藏在这里了。<br><br>
                    <span style="color:#ff00aa;">— 2026年9月29日 深夜11:38</span>
                </p>
            </div>
        </div>
    </div>
    
    <!-- 点击特效 -->
    <div id="click-effect" class="click-effect"></div>
    
    <script>
        // 粒子效果
        function createParticles() {
            const canvas = document.getElementById('particles');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const ctx = canvas.getContext('2d');
            const particles = [];
            
            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 3 + 1;
                    this.speedX = Math.random() * 0.5 - 0.25;
                    this.speedY = Math.random() * 0.5 - 0.25;
                    this.opacity = Math.random() * 0.5 + 0.3;
                }
                
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    
                    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                }
                
                draw() {
                    ctx.fillStyle = `rgba(255, 0, 170, ${this.opacity})`;
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                }
            }
            
            for (let i = 0; i < 120; i++) {
                particles.push(new Particle());
            }
            
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                
                requestAnimationFrame(animateParticles);
            }
            
            animateParticles();
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }
        
        // 随机点击特效
        function createClickEffect(e) {
            const effect = document.getElementById('click-effect');
            effect.textContent = ['✦', '♡', '◉', '⋆', '✧'][Math.floor(Math.random() * 5)];
            effect.style.left = e.pageX + 'px';
            effect.style.top = e.pageY + 'px';
            effect.style.opacity = 1;
            
            setTimeout(() => {
                effect.style.opacity = 0;
            }, 800);
        }
        
        // 切换页面
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(section).style.display = 'block';
            
            // 添加淡入动画
            const currentSection = document.getElementById(section);
            currentSection.style.opacity = 0;
            setTimeout(() => {
                currentSection.style.transition = 'opacity 0.6s';
                currentSection.style.opacity = 1;
            }, 50);
        }
        
        // 随机主题切换
        let isDark = true;
        function toggleTheme() {
            isDark = !isDark;
            if (isDark) {
                document.body.style.background = '#0a0a0a';
                document.documentElement.style.setProperty('--accent', '#ff00aa');
            } else {
                document.body.style.background = '#fffaf0';
                document.documentElement.style.setProperty('--accent', '#ff8800');
            }
        }
        
        // 初始化
        window.onload = function() {
            createParticles();
            showSection('home');
            
            // 点击随机特效
            document.addEventListener('click', createClickEffect);
            
            // 键盘快捷键（隐藏/显示导航）
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    const nav = document.querySelector('nav');
                    nav.style.display = nav.style.display === 'none' ? 'block' : 'none';
                }
            });
            
            console.log('%c秘密空间已准备好～', 'color:#ff00aa; font-family:monospace;');
        };
    </script>
</body>
</html>
